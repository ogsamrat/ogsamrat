<svg width="960" height="168" viewBox="0 0 960 168" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Samrat Talukdar</title>
  <desc id="desc">A compact terminal showing Samrat's current areas of work.</desc>
  <style>
    .card { fill: #F6F8FA; stroke: #D0D7DE; }
    .divider { stroke: #D0D7DE; }
    .primary { fill: #24292F; }
    .muted { fill: #57606A; }
    .quiet { fill: #6E7781; }
    .green { fill: #1A7F37; }
    .blue { fill: #0969DA; }
    .red-dot { fill: #CF222E; }
    .yellow-dot { fill: #BF8700; }
    .green-dot { fill: #1A7F37; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #161B22; stroke: #30363D; }
      .divider { stroke: #30363D; }
      .primary { fill: #F0F6FC; }
      .muted { fill: #8B949E; }
      .quiet { fill: #7D8590; }
      .green { fill: #3FB950; }
      .blue { fill: #58A6FF; }
      .red-dot { fill: #FF7B72; }
      .yellow-dot { fill: #D29922; }
      .green-dot { fill: #3FB950; }
    }
  </style>

  <rect class="card" x="1" y="1" width="958" height="166" rx="12" stroke-width="2"/>
  <path class="divider" d="M1 35H959"/>

  <circle class="red-dot" cx="21" cy="18" r="5"/>
  <circle class="yellow-dot" cx="39" cy="18" r="5"/>
  <circle class="green-dot" cx="57" cy="18" r="5"/>
  <text class="quiet" x="480" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">samrat@github</text>

  <text class="green" x="28" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">samrat@kolkata</text>
  <text class="quiet" x="166" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">:</text>
  <text class="blue" x="178" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">~</text>
  <text class="primary" x="192" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">$ whoami</text>

  <text class="primary" x="28" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="700">samrat talukdar</text>
  <text class="muted" x="28" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">infra / agents / onchain / automation</text>

  <circle class="green" cx="852" cy="68" r="4"/>
  <text class="muted" x="865" y="73" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">online</text>

  <rect class="blue" x="367" y="125" width="9" height="18" rx="1">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
